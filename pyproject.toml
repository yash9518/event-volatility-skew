[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "event-volatility-skew"
version = "0.1.0"
description = "Real historical SPY option smiles around the September 2024 FOMC"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = ["numpy>=2,<3", "pandas>=2.2,<4", "matplotlib>=3.9,<4", "scipy>=1.13,<2", "yfinance>=0.2.54,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
notebook = ["jupyterlab>=4,<5", "ipykernel>=6,<8", "nbformat>=5,<6", "nbclient>=0.10,<1"]

[tool.setuptools.packages.find]
include = ["event_skew*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
